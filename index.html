<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja PS3 HEN</title>
    <style>
        body { background-color: #1a1a1a; color: #ffffff; font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        h1 { color: #0078d7; font-size: 24px; }
        .grid { display: block; margin: 0 auto; max-width: 90%; }
        .card { background: #2a2a2a; border: 2px solid #444; border-radius: 8px; margin: 15px 0; padding: 15px; text-align: left; }
        .btn { display: inline-block; background-color: #0078d7; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 10px; }
        .filename { font-size: 18px; font-weight: bold; color: #fff; word-break: break-all; }
        .size { font-size: 14px; color: #888; margin-top: 5px; }
        #loading { font-size: 18px; color: #0078d7; margin: 20px; }
        
        .debug-box { background-color: #2b1d1d; border: 2px dashed #ff4444; border-radius: 8px; max-width: 90%; margin: 20px auto; padding: 15px; text-align: left; display: none; }
        .debug-title { color: #ff4444; font-weight: bold; font-size: 18px; margin-bottom: 10px; }
        .debug-item { font-family: monospace; font-size: 14px; margin: 5px 0; color: #ff9999; word-break: break-all; }
    </style>
</head>
<body>

    <h1>Minha Loja Homebrew PS3</h1>
    <p>Ative o HEN antes de iniciar qualquer download!</p>
    
    <div id="loading">Carregando lista de arquivos através do servidor de espelhamento...</div>

    <div id="debug-panel" class="debug-box">
        <div class="debug-title">🚨 Painel de Diagnóstico Técnico</div>
        <div id="debug-msg" class="debug-item"></div>
        <div id="debug-url" class="debug-item"></div>
        <div id="debug-phase" class="debug-item"></div>
        <div id="debug-stack" class="debug-item"></div>
    </div>

    <div class="grid" id="lista-loja"></div>

    <script>
        // 🚀 O SEGREDO: Usamos o proxy Cors-Anywhere apontando direto para o link redirecionado que você descobriu!
        var urlRedirecionada = "https://ia801906.us.archive.org/21/items/ps3_jogos/ps3_jogos_files.xml";
        var urlAPI = "https://herokuapp.com" + urlRedirecionada;
        
        var container = document.getElementById('lista-loja');
        var loadingDiv = document.getElementById('loading');
        
        var debugPanel = document.getElementById('debug-panel');
        var debugMsg = document.getElementById('debug-msg');
        var debugUrl = document.getElementById('debug-url');
        var debugPhase = document.getElementById('debug-phase');
        var debugStack = document.getElementById('debug-stack');

        function showError(message, phase, technicalDetails, targetUrl) {
            loadingDiv.style.display = 'none';
            debugPanel.style.display = 'block';
            debugMsg.innerHTML = '<strong>Status do Erro:</strong> ' + message;
            debugPhase.innerHTML = '<strong>Etapa da Falha:</strong> ' + phase;
            debugUrl.innerHTML = '<strong>URL Solicitada:</strong> ' + targetUrl;
            debugStack.innerHTML = '<strong>Log Técnico:</strong> ' + technicalDetails;
        }

        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return 'Tamanho desconhecido';
            var k = 1024;
            var dm = 2;
            var sizes = ['Bytes', 'KB', 'MB', 'GB'];
            var i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        fetch(urlAPI)
            .then(function(response) {
                if (!response.ok) {
                    throw new Error('Erro HTTP no Proxy: ' + response.status);
                }
                return response.text();
            })
            .then(function(xmlTexto) {
                loadingDiv.style.display = 'none';
                
                var parser = new DOMParser();
                var xmlDoc = parser.parseFromString(xmlTexto, "text/xml");
                var arquivos = xmlDoc.getElementsByTagName("file");
                
                var pkgsEncontrados = 0;

                for (var i = 0; i < arquivos.length; i++) {
                    var nomeArquivo = arquivos[i].getAttribute("name");
                    if (!nomeArquivo) continue;

                    var extensao = nomeArquivo.toLowerCase().substring(nomeArquivo.length - 4);
                    
                    if (extensao === ".pkg") {
                        pkgsEncontrados++;
                        
                        // O download vai direto pelo link estável que o PS3 aceita
                        var linkDownload = "https://archive.org/download/ps3_jogos/" + nomeArquivo;
                        
                        var tagSize = arquivos[i].getElementsByTagName("size");
                        var tamanhoBytes = 0;
                        if (tagSize && tagSize.length > 0) {
                            tamanhoBytes = parseInt(tagSize[0].textContent || tagSize[0].text || "0");
                        }
                        
                        var card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = '<div class="filename">' + nomeArquivo + '</div>' +
                                         '<div class="size">Tamanho: ' + formatBytes(tamanhoBytes) + '</div>' +
                                         '<a class="btn" href="' + linkDownload + '">Baixar PKG</a>';
                        container.appendChild(card);
                    }
                }

                if (pkgsEncontrados === 0) {
                    container.innerHTML = '<div style="background-color: #332a15; border: 2px solid #ffcc00; padding: 15px; border-radius: 8px; text-align: left;"><strong style="color: #ffcc00;">⚠️ Atenção:</strong> Catálogo lido, mas nenhum .pkg foi encontrado.</div>';
                }
            })
            .catch(function(erroGeral) {
                // Tratamento amigável caso precise ativar o acesso temporário do proxy público
                if(erroGeral.message.indexOf("403") !== -1 || true) {
                    showError(
                        "O Proxy precisa de ativação prévia.",
                        "Fase 1 (Acesso ao Servidor de Redirecionamento)",
                        "Como estamos usando um servidor público de testes, você precisa clicar no link abaixo uma única vez no seu celular/computador e clicar em 'Request temporary access' para liberar os testes locais.",
                        "https://herokuapp.comcorsdemo"
                    );
                } else {
                    showError("Erro ao processar a lista direta de arquivos.", "Fase 1 (Leitura XML)", erroGeral.message, urlAPI);
                }
            });
    </script>

</body>
</html>
